name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      - name: Update version.json (国内更新源)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-release.apk"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "notes": "",
            "apk": "${BASE}",
            "mirrors": [
              "https://ghproxy.net/${BASE}",
              "https://ghfast.top/${BASE}",
              "https://gh-proxy.com/${BASE}"
            ],
            "htmlUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF
          git add version.json
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): version.json -> ${GITHUB_REF_NAME}" || echo "no changes to commit"
          git push origin main || echo "push skipped"

      - name: Purge jsDelivr cache
        run: curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/version.json" || true
